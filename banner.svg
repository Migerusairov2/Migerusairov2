<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117"/>
      <stop offset="100%" stop-color="#171A24"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5F87"/>
      <stop offset="100%" stop-color="#E3A34D"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#FFFFFF" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>

  <!-- left text block -->
  <text x="70" y="118" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="42" font-weight="700" fill="#ECE8E1">Migerusairov2</text>
  <text x="70" y="152" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19" fill="#8B5F87">Odoo Developer, Backend Automation &amp; Business Systems</text>

  <line x1="70" y1="178" x2="330" y2="178" stroke="#2A2E3D" stroke-width="1.5"/>

  <text x="70" y="210" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="15" fill="#8891A3">Python</text>
  <text x="150" y="210" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="15" fill="#8891A3">PHP</text>
  <text x="205" y="210" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="15" fill="#8891A3">JavaScript</text>
  <text x="310" y="210" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="15" fill="#8891A3">PostgreSQL</text>

  <text x="70" y="240" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#565C6E">Building tailored ERP workflows on Odoo 13</text>

  <!-- right: automation pipeline graphic -->
  <g transform="translate(730,150)">
    <path d="M 0 0 L 110 -38 L 220 22 L 330 -18" fill="none" stroke="url(#line)" stroke-width="2" opacity="0.8"/>

    <circle cx="0" cy="0" r="9" fill="#171A24" stroke="#8B5F87" stroke-width="2.5"/>
    <text x="0" y="34" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#8891A3" text-anchor="middle">Trigger</text>

    <circle cx="110" cy="-38" r="9" fill="#171A24" stroke="#9C6A96" stroke-width="2.5"/>
    <text x="110" y="-52" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#8891A3" text-anchor="middle">Rule</text>

    <circle cx="220" cy="22" r="9" fill="#171A24" stroke="#C88A76" stroke-width="2.5"/>
    <text x="220" y="46" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#8891A3" text-anchor="middle">Action</text>

    <circle cx="330" cy="-18" r="9" fill="#171A24" stroke="#E3A34D" stroke-width="2.5"/>
    <text x="330" y="-32" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#8891A3" text-anchor="middle">Sync</text>
  </g>
</svg>
